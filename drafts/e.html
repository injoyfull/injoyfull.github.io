<style>
*{box-sizing:border-box;margin:0} html{scroll-behavior:smooth}
body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:#26211C;line-height:1.7;overflow-x:hidden}
a{text-decoration:none;color:inherit} img{max-width:100%}
.switch{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;padding:.5rem;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);font-size:.75rem;font-weight:700;border-bottom:1px solid rgba(0,0,0,.08)}
.switch a{padding:.28rem .7rem;border-radius:999px;border:1.5px solid rgba(0,102,179,.3)}
.switch a.on{background:#0066B3;color:#fff;border-color:#0066B3}

body{background:#fff}
.hero{min-height:88vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:6rem 1.5rem 3rem}
h1{font-weight:800;font-size:clamp(1.9rem,5.2vw,3.2rem);letter-spacing:-.02em;line-height:1.4}
h1 em{font-style:normal;color:#0066B3}
h1 .dot{color:#F5793B}
.sub{margin-top:1rem;color:#5C5348}
.go{position:absolute;right:8%;bottom:12%;width:6rem;height:6rem;border-radius:50%;background:#26211C;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.9rem;transition:.15s}
.go:hover{scale:1.06;background:#0066B3}
/* 얼굴 있는 도형들 */
.fl{position:absolute;display:flex;align-items:center;justify-content:center;animation:bob 7s ease-in-out infinite alternate}
.fl::after{content:"˙ ˘ ˙";font-size:.9em;letter-spacing:-.05em;color:rgba(38,33,28,.75);font-weight:700}
@keyframes bob{to{translate:0 14px}}
.f1{width:7rem;height:7rem;background:#FCCA59;border-radius:50%;left:9%;top:16%;font-size:1.5rem;animation-delay:-.8s}
.f1{border-radius:50% 50% 48% 52%/52% 48% 52% 48%}
.f2{width:5.5rem;height:5.5rem;background:#99B7F5;border-radius:58% 42% 55% 45%/52% 58% 42% 48%;right:12%;top:20%;font-size:1.2rem;animation-delay:-2.6s}
.f3{width:4rem;height:4rem;background:#F296BD;border-radius:50%;left:20%;bottom:20%;font-size:.95rem;animation-delay:-4s}
.f4{width:4.6rem;height:4.6rem;background:#8FBF9F;right:24%;bottom:26%;font-size:1rem;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;animation-delay:-1.7s}
.f5{width:2.6rem;height:2.6rem;background:#F5793B;border-radius:50%;left:38%;top:12%;font-size:.6rem;animation-delay:-3.2s}
.svc{max-width:64rem;margin:0 auto;padding:3rem 1.5rem 5rem}
.svc h2{text-align:center;font-weight:800;font-size:1.4rem;margin-bottom:2.2rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:2.5rem}
.col h3{display:flex;align-items:center;justify-content:space-between;font-size:1rem;font-weight:800;border-bottom:2px solid #26211C;padding-bottom:.5rem;margin-bottom:.8rem}
.col h3 i{width:.8rem;height:.8rem;border-radius:50%}
.col:nth-child(1) h3 i{background:#99B7F5}.col:nth-child(2) h3 i{background:#FCCA59;border-radius:2px}.col:nth-child(3) h3 i{background:#F5793B;clip-path:polygon(50% 0,100% 100%,0 100%)}
.col li{list-style:none;padding:.22rem 0;color:#5C5348;font-size:.95rem}
.col b{color:#26211C}

</style>
</head>

  </div>
</section>
