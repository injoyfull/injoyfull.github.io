<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>B — 종이 공작 | 인조이풀 시안</title>
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0} html{scroll-behavior:smooth}
body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:#26211C;line-height:1.7;overflow-x:hidden}
a{text-decoration:none;color:inherit} img{max-width:100%}
.switch{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:.5rem;justify-content:center;padding:.5rem;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);font-size:.8rem;font-weight:700;border-bottom:1px solid rgba(0,0,0,.08)}
.switch a{padding:.3rem .8rem;border-radius:999px;border:1.5px solid rgba(0,102,179,.3)}
.switch a.on{background:#0066B3;color:#fff;border-color:#0066B3}

body{background:#F7F2E4}
.serif{font-family:"Gowun Batang",serif}
.hero{max-width:64rem;margin:0 auto;padding:7rem 1.5rem 3rem;position:relative}
.paper{background:#fff;padding:2.6rem 2.2rem 2.2rem;box-shadow:0 14px 34px rgba(38,33,28,.13);rotate:-.8deg;position:relative;max-width:44rem}
.paper::before{content:"";position:absolute;top:-14px;left:44px;width:110px;height:30px;background:rgba(255,217,113,.85);rotate:-4deg;box-shadow:0 2px 5px rgba(38,33,28,.15)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.24em;color:#0066B3}
h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(2rem,6vw,3.3rem);line-height:1.3;margin:.8rem 0}
h1 mark{background:linear-gradient(transparent 55%,rgba(255,217,113,.9) 55%);color:inherit;padding:0 .1em}
.sub{color:#5C5348}
.scrap{position:absolute;background:#DCEBFA;padding:.7rem 1.1rem;font-size:.9rem;box-shadow:0 6px 16px rgba(38,33,28,.14)}
.s1{right:6%;top:22%;rotate:3deg}
.s2{right:12%;top:56%;rotate:-2.5deg;background:#FFF3D6}
.s3{right:22%;bottom:4%;rotate:1.5deg;background:#fff}
.scrap::before{content:"";position:absolute;top:-10px;left:50%;translate:-50% 0;width:56px;height:18px;background:rgba(0,102,179,.22);rotate:-2deg}
.cta{display:inline-flex;gap:.5rem;align-items:center;margin-top:1.6rem;background:#0066B3;color:#fff;font-weight:700;padding:.85rem 1.5rem;border-radius:2px;box-shadow:4px 4px 0 rgba(38,33,28,.85)}
.cta img{width:1.4rem}
.divider{display:block;width:100%;height:26px;background:radial-gradient(circle at 13px -8px,transparent 18px,#fff 19px) 0 0/52px 26px}
.white{background:#fff;padding:3.4rem 1.5rem}
.white .in2{max-width:64rem;margin:0 auto}
h2{font-family:"Gowun Batang",serif;font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.4}
h2 strong{background:linear-gradient(transparent 55%,rgba(255,217,113,.9) 55%)}
.polas{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:2rem}
.pola{background:#fff;border:1px solid rgba(38,33,28,.12);padding:.9rem .9rem 2.6rem;box-shadow:0 10px 24px rgba(38,33,28,.14);width:15rem;position:relative}
.pola:nth-child(odd){rotate:-2.4deg}.pola:nth-child(even){rotate:1.8deg}
.pola::before{content:"";position:absolute;top:-12px;left:50%;translate:-50%;width:84px;height:24px;background:rgba(255,217,113,.85);rotate:-3deg}
.pola b{position:absolute;bottom:.7rem;left:0;right:0;text-align:center;font-family:"Gowun Batang",serif}
.pola .ph{height:9rem;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#5C5348}
.p1 .ph{background:#DCEBFA}.p2 .ph{background:#FFF3D6}.p3 .ph{background:#F4E3EA}.p4 .ph{background:#E4EAD2}
.meet{background:#F7F2E4;padding:3.6rem 1.5rem;text-align:center}
.meet .note{display:inline-block;background:#fff;padding:2.2rem 2.6rem;box-shadow:0 12px 30px rgba(38,33,28,.14);rotate:.8deg;position:relative}
.meet .note::before{content:"";position:absolute;top:-12px;left:50%;translate:-50%;width:96px;height:26px;background:rgba(0,102,179,.25);rotate:2deg}
.meet img{width:3rem}
.meet a{display:inline-block;margin-top:1rem;background:#FFD971;font-weight:700;padding:.8rem 1.5rem;box-shadow:3px 3px 0 rgba(38,33,28,.8)}

</style>
</head>
<body>
<nav class="switch">
  <a href="a.html" class="">A 컨페티</a>
  <a href="b.html" class="on">B 종이</a>
  <a href="c.html" class="">C 블록</a>
  <a href="d.html" class="">D 라우드</a>
  <a href="e.html" class="">E 심플</a>
  <a href="f.html" class="">F 텍스처</a>
  <a href="g.html" class="">G 유럽풍</a>
  <a href="/">현재</a>
</nav>

<header class="hero">
  <div class="paper">
    <span class="tag">OPEN-ENDED CREATIVE WORKSHOP · 하남</span>
    <h1>인풋은 가득한데,<br><mark>아웃풋</mark>을 펼칠 곳이 없다.</h1>
    <p class="sub">내면의 행복이 가득한, 인조이풀의 시간과 공간을 선물합니다.</p>
    <a class="cta" href="#"><img src="../smile.png" alt="">워크숍으로 만나요</a>
  </div>
  <div class="scrap s1">"내가 만들었는데, 너무 예뻐요"</div>
  <div class="scrap s2">"감동이에요"</div>
  <div class="scrap s3">— 쪼이들의 말</div>
</header>
<span class="divider"></span>
<section class="white"><div class="in2">
  <h2>답이 정해지지 않은 재료로,<br><strong>나만의 답</strong>을 만드는 곳.</h2>
  <div class="polas">
    <div class="pola p1"><span class="ph">18~30개월</span><b>토들러팝</b></div>
    <div class="pola p2"><span class="ph">5~7세 · 멤버십</span><b>키즈팝</b></div>
    <div class="pola p3"><span class="ph">8세 이상</span><b>크리디팝</b></div>
    <div class="pola p4"><span class="ph">성인 · 시니어</span><b>올드팝</b></div>
  </div>
</div></section>
<section class="meet">
  <div class="note">
    <img src="../smile.png" alt="">
    <h2>워크숍으로 만나요.</h2>
    <a href="#">네이버에서 날짜 고르기 →</a>
  </div>
</section>

</body></html>
